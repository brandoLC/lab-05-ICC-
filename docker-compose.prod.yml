services:
  postgres:
    image: postgres:15-alpine
    container_name: mundial-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mundial_db}
      POSTGRES_USER: ${POSTGRES_USER:-mundial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mundial_pass_seguro_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mundial-network
    mem_limit: 2g
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mundial_user} -d ${POSTGRES_DB:-mundial_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  backend:
    image: brando14/mundial-backend:v1.0
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mundial-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://mundial_user:mundial_pass_seguro_2026@postgres:5432/mundial_db}
      FOOTBALL_API_TOKEN: ${FOOTBALL_API_TOKEN:-343be13f1f734c93be81a5a8e2b468db}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - mundial-network
    mem_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  frontend:
    image: brando14/mundial-frontend:v1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    container_name: mundial-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - mundial-network
    mem_limit: 1g
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local

networks:
  mundial-network:
    driver: bridge
